<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Year Surprise 💛</title>
<style>
body { 
  margin: 0; 
  font-family: Arial, sans-serif; 
  background: #111; 
  color: #fff; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  min-height: 100vh; 
  text-align: center; 
}
.container { max-width: 400px; padding: 20px; }
.ticket, .photo, .letter { 
  background: #222; 
  border-radius: 15px; 
  padding: 20px; 
  margin: 20px 0; 
}
button { 
  margin-top: 15px; 
  padding: 10px 20px; 
  border: none; 
  border-radius: 10px; 
  background: #ffcc70; 
  color: #111; 
  font-weight: bold; 
  cursor: pointer; 
}
.hidden { display: none; }
img { max-width: 100%; border-radius: 15px; margin: 10px 0; cursor: pointer; }
</style>
</head>
<body>

<div class="container">

  <!-- GOLDEN TICKET -->
  <div class="ticket" id="ticket">
    <h1>🎫 Your Golden Ticket</h1>
    <p>Tap to claim unlimited love 💛</p>
    <button onclick="startPhotos()">Claim Ticket</button>
  </div>

  <!-- MEMORY PHOTOS -->
  <div class="photo hidden" id="photos">
    <img id="memoryImg" src="https://i.imgur.com/photo1.jpg" alt="Memory 1">
    <button onclick="nextPhoto()">Next memory 💛</button>
  </div>

  <!-- HAPPY NEW YEAR LETTER -->
  <div class="letter hidden" id="letter">
    <h2>💌 Happy New Year!</h2>
    <p>My Soul,</p>
    <p>Every moment with you this year was special.</p>
    <p>May the new year bring you endless love and joy 💛</p>
    <p>Always yours 💛</p>
  </div>

</div>

<script>
let currentPhoto = 0;
const photos = [
  "https://i.postimg.cc/X76DsT9V/IMG-20251119-171857-274.webp",
  "https://i.imgur.com/photo2.jpg",
  "https://i.imgur.com/photo3.jpg",
  "https://i.imgur.com/photo4.jpg"
];

function startPhotos() {
  document.getElementById("ticket").classList.add("hidden");
  document.getElementById("photos").classList.remove("hidden");
}

function nextPhoto() {
  currentPhoto++;
  if(currentPhoto < photos.length){
    document.getElementById("memoryImg").src = photos[currentPhoto];
  } else {
    document.getElementById("photos").classList.add("hidden");
    document.getElementById("letter").classList.remove("hidden");
  }
}
</script>

</body>
      </html>
